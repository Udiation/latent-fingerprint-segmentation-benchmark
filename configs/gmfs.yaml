schema_version: 1
method: gmfs
display_name_default: GMFS (default)
display_name_tuned: GMFS (val-tuned)
target_ppi: 500
default:
  sigma: 4.333333333333333
  percentile: 95
  threshold: 0.2
  closing_count: 6
  opening_count: 12
tuning:
  metric: macro_dice
  split: val
  candidates:
    policy: default_plus_symmetric_corners
    sigma: [3.0, 6.0]
    threshold: [0.15, 0.25]
    closing_count: [4, 8]
    opening_count: [8, 16]
  tie_break: lexicographic_parameter_tuple
