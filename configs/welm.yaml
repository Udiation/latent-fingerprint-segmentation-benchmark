schema_version: 1
method: welm
display_name: Weighted ELM
task: block
data:
  target_ppi: 500
  block_size: 16
  context_size: 32
  normalization: train_only
selection:
  split: val
  metric: balanced_block_accuracy
  hidden_units: [500, 1000]
