<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title description">
  <title id="title">Synthetic minutiae-hull ground-truth explanation</title>
  <desc id="description">A generated elliptical ridge field with marked minutiae and a convex hull. The hull is labelled known fingerprint while the exterior ridge area is labelled unknown rather than background.</desc>
  <rect width="900" height="420" rx="24" fill="#f8fafc"/>
  <defs>
    <clipPath id="print"><ellipse cx="330" cy="210" rx="240" ry="160"/></clipPath>
    <pattern id="ridges" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <path d="M0 4 Q9 -2 18 4 M0 13 Q9 7 18 13" fill="none" stroke="#64748b" stroke-width="2"/>
    </pattern>
  </defs>
  <ellipse cx="330" cy="210" rx="240" ry="160" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="70" y="35" width="520" height="350" fill="url(#ridges)" clip-path="url(#print)" opacity=".85"/>
  <polygon points="190,255 220,145 325,100 455,145 500,260 405,325 270,320" fill="#14b8a633" stroke="#0f766e" stroke-width="5" stroke-linejoin="round"/>
  <g fill="#4f46e5" stroke="#fff" stroke-width="3">
    <circle cx="190" cy="255" r="8"/><circle cx="220" cy="145" r="8"/><circle cx="325" cy="100" r="8"/>
    <circle cx="455" cy="145" r="8"/><circle cx="500" cy="260" r="8"/><circle cx="405" cy="325" r="8"/>
    <circle cx="270" cy="320" r="8"/><circle cx="330" cy="205" r="8"/><circle cx="380" cy="260" r="8"/>
  </g>
  <path d="M520 165 C600 120 640 110 690 105" fill="none" stroke="#0f766e" stroke-width="3"/>
  <text x="705" y="110" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#0f172a">Known foreground</text>
  <text x="705" y="138" font-family="system-ui,sans-serif" font-size="17" fill="#475569">minutiae convex hull</text>
  <path d="M500 345 C605 370 640 345 690 315" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="705" y="315" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#0f172a">Unknown extent</text>
  <text x="705" y="343" font-family="system-ui,sans-serif" font-size="17" fill="#475569">not scored as background</text>
  <g transform="translate(665 205)">
    <circle cx="12" cy="12" r="8" fill="#4f46e5" stroke="#fff" stroke-width="3"/>
    <text x="32" y="19" font-family="system-ui,sans-serif" font-size="18" fill="#334155">expert minutia</text>
  </g>
  <text x="34" y="397" font-family="system-ui,sans-serif" font-size="15" fill="#64748b">Fully synthetic diagram · explanatory geometry only</text>
</svg>
