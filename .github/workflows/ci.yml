name: synthetic-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/make_synthetic_demo.py --out examples/synthetic --subjects 4 --per-subject 1 --seed 7
      - run: python scripts/build_synthetic_site_demo.py --methods rf --steps 1 --threads 1
      - run: python scripts/smoke_synthetic.py --work-dir .smoke
      - run: python site/build.py
      - run: python scripts/check_site_numbers.py
      - run: python scripts/check_accessibility.py
      - run: python scripts/check_release_requirements.py
      - run: pytest -q tests/test_public_release.py tests/test_synthetic_site_demo.py tests/test_release_requirements.py tests/test_metrics_public.py tests/test_update_from_aggregate.py tests/test_stage5_public_import.py tests/test_public_figures.py tests/test_lighthouse_gate.py tests/test_lightweight_provenance.py
      - run: python scripts/scan_release.py --phase working --allow-limited-synthetic
