name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-source-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python site/build.py
      - run: python scripts/check_site_numbers.py
      - run: python scripts/check_accessibility.py
      - run: python scripts/check_release_requirements.py
      - run: python scripts/scan_release.py
