[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-fingerprint-segmentation-benchmark"
version = "0.1.0.dev0"
description = "Reproducible benchmarking tools for latent fingerprint foreground segmentation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Udit Narayan"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "opencv-python-headless>=4.8",
  "pandas>=2.0",
  "joblib>=1.3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
deep = ["torch>=2.1", "transformers>=4.45"]
demo = ["gradio>=5.0", "Pillow>=10"]

[tool.setuptools]
packages = ["segbench", "report", "demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "optional_dependency: test requires an optional runtime dependency",
  "slow: test is not part of the five-minute public smoke test",
]
